name: Update Dashboard (Staging)

on:
  workflow_dispatch:
  # Uncomment to enable cron: runs every 15 min
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run dashboard
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 update_dashboard.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Dashboard update $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
